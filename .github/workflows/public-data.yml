name: public-data

# This repository is public: a PR's commits, branch name, title, and body must carry no customer data
# (TECH-5914). The check refuses Terros IDs, emails, phone numbers, and the customer names in the
# PUBLIC_DATA_DENYLIST secret, which is never committed here; it never prints a denylisted name. Keep the
# secret on one line, names separated by commas: Actions masks a secret's whole value in this public log,
# and a multi-line value may not be masked line by line.
#
# Trust boundary: no code a PR can change ever runs with the secret.
# - `pr-code` (pull_request) runs the PR's own copy of the check with no secret, so a change to the
#   check is exercised, and fork PRs get the ID, email and phone checks. A pull_request run takes this
#   file from the PR too, which is why the secret is never referenced here for that event.
# - `public-data` (pull_request_target) takes this file and the check from the default branch, and reads
#   the PR's commits only as git objects: it fetches them into the default-branch checkout and never
#   checks them out, installs, or runs them. It runs only for PRs from this repository; a fork PR never
#   gets the secret. packages/runner/src/public-data-workflow.test.ts asserts this shape.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  pr-code:
    name: public-data (PR code, no names)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Commits
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node packages/runner/container/check-public-data.mjs range "$BASE" "$HEAD"
      - name: Branch name, PR title and body
        if: ${{ !cancelled() }}
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n\n%s\n' "$BRANCH" "$TITLE" "$BODY" | node packages/runner/container/check-public-data.mjs text "branch, PR title and body"

  public-data:
    name: public-data
    if: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the default branch (trusted code)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Fetch the PR's commits as data
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags --quiet origin "$BASE" "$HEAD"
      - name: Commits
        env:
          PUBLIC_DATA_DENYLIST: ${{ secrets.PUBLIC_DATA_DENYLIST }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: node packages/runner/container/check-public-data.mjs range "$BASE" "$HEAD"
      - name: Branch name, PR title and body
        if: ${{ !cancelled() }}
        env:
          PUBLIC_DATA_DENYLIST: ${{ secrets.PUBLIC_DATA_DENYLIST }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
          TITLE: ${{ github.event.pull_request.title }}
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s\n%s\n\n%s\n' "$BRANCH" "$TITLE" "$BODY" | node packages/runner/container/check-public-data.mjs text "branch, PR title and body"
